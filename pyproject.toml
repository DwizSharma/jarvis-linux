[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-linux"
version = "0.1.0"
description = "Headless voice-controlled Linux desktop assistant using AT-SPI"
requires-python = ">=3.11"
dependencies = ["vosk>=0.3.45", "sounddevice>=0.5.2"]

[project.scripts]
jarvis = "jarvis.app:_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

